# Lean mutants for LeanProofs/Stanley (MO 486548): each plants one wrong definition or claim and must stop
# `lake build LeanProofs` with a Lean error, after a passing control build (converted from the v1 mutants.sh).
#   cd lean && python3 -I scripts/mutate.py scripts/mutants.toml   (then `lake build LeanProofs` again)
[check]
cmd = ["lake", "build", "LeanProofs"]
cwd = ".."
timeout = 1800
mode = "inplace"
fail_markers = ["error"]

[[mutant]]
name = '''growth rule: asymmetric doubled-row case'''
file = "../LeanProofs/Stanley/Growth.lean"
old = '''else (some (r - 1), some (r - 1), false))'''
new = '''else (some r, some (r - 1), false))'''

[[mutant]]
name = '''column descents reversed'''
file = "../LeanProofs/Stanley/Growth.lean"
old = '''g.col (i + 1) < g.col i ↔ u i < u (i + 1)'''
new = '''g.col (i + 1) < g.col i ↔ u (i + 1) < u i'''

[[mutant]]
name = '''two-started runs without the long-predecessor rule'''
file = "../LeanProofs/Stanley/Fill.lean"
old = '''(fun q => 2 ≤ q ∧ q - 1 ∈ X ∧ q - 2 ∉ X ∧ m ≤ q ∧ 2 ≤ rk X q)'''
new = '''(fun q => 2 ≤ q ∧ q - 1 ∈ X ∧ m ≤ q ∧ 2 ≤ rk X q)'''

[[mutant]]
name = '''leg letters skip a row'''
file = "../LeanProofs/Stanley/Fill.lean"
old = '''def exL (p : ℕ) : ℕ := if rk X p = 1 then 1 else rk X p'''
new = '''def exL (p : ℕ) : ℕ := if rk X p = 1 then 1 else rk X p + 1'''

[[mutant]]
name = '''G claimed 1-Lipschitz'''
file = "../LeanProofs/Stanley/Density.lean"
old = '''|stG m x - stG m y| ≤ 2 * hammingDist x y'''
new = '''|stG m x - stG m y| ≤ 1 * hammingDist x y'''

[[mutant]]
name = '''density constant 5 instead of 6'''
file = "../LeanProofs/Stanley/Density.lean"
old = '''(4 : ℝ) ^ (n - 1) - f n ≤ 6 * Real.exp'''
new = '''(4 : ℝ) ^ (n - 1) - f n ≤ 5 * Real.exp'''

[[mutant]]
name = '''bad points: 2 slow tails instead of 3'''
file = "../LeanProofs/Stanley/Density.lean"
old = '''      3 * (2 ^ (n - 1) * Real.exp (-(n : ℝ) / 20000)) := by'''
new = '''      2 * (2 ^ (n - 1) * Real.exp (-(n : ℝ) / 20000)) := by'''

[[mutant]]
name = '''fast tails absorbed from n = 1000'''
file = "../LeanProofs/Stanley/Density.lean"
old = '''theorem exp_absorb {n : ℝ} (hn : 6000 ≤ n) :'''
new = '''theorem exp_absorb {n : ℝ} (hn : 1000 ≤ n) :'''

[[mutant]]
name = '''Theorem 2 with pi^4/24 instead of pi^4/48'''
file = "../LeanProofs/Stanley/Alternating.lean"
old = '''1 - Real.pi ^ 4 / (48 * n)| ≤ C / (n : ℝ) ^ 2 := by
  set C0'''
new = '''1 - Real.pi ^ 4 / (24 * n)| ≤ C / (n : ℝ) ^ 2 := by
  set C0'''

[[mutant]]
name = '''c_{n,n-2} with 1/3 for 1/2'''
file = "../LeanProofs/Stanley/Alternating.lean"
old = '''theorem cc_two (m : ℕ) : cc (m + 2) m = (m : ℝ) / 3 + if Odd m then 0 else 1 / 2'''
new = '''theorem cc_two (m : ℕ) : cc (m + 2) m = (m : ℝ) / 3 + if Odd m then 0 else 1 / 3'''

[[mutant]]
name = '''sigma bound too strong'''
file = "../LeanProofs/Stanley/Alternating.lean"
old = '''theorem σ_close {m : ℕ} (hm : 1 ≤ m) : |σ m - 1| ≤ 3 / 2 / 3 ^ m'''
new = '''theorem σ_close {m : ℕ} (hm : 1 ≤ m) : |σ m - 1| ≤ 1 / 2 / 3 ^ m'''

[[mutant]]
name = '''a_m formula with 2 for 4'''
file = "../LeanProofs/Stanley/Alternating.lean"
old = '''a m = 4 * m ! * σ m ^ 2 / r ^ (m + 1) := by'''
new = '''a m = 2 * m ! * σ m ^ 2 / r ^ (m + 1) := by'''

[[mutant]]
name = '''descent pairs = orbits plus one'''
file = "../LeanProofs/Stanley/DoubleCoset.lean"
old = '''jointSubsetCount n A B = Nat.card (FQ n A B)'''
new = '''jointSubsetCount n A B + 1 = Nat.card (FQ n A B)'''

[[mutant]]
name = '''even-atom factor with the wrong parity'''
file = "../LeanProofs/Stanley/Atoms.lean"
old = '''Φ (ext c d) = (if Even (∑ a, c a) then 1 else 0) * Φ c'''
new = '''Φ (ext c d) = (if Odd (∑ a, c a) then 1 else 0) * Φ c'''

[[mutant]]
name = '''splice sends d to the wrong new point'''
file = "../LeanProofs/Stanley/PermCount.lean"
old = '''    | some none => some (some (τ d))
    | some (some a) => if a = d then none else some (some (τ a))'''
new = '''    | some none => some (some (τ d))
    | some (some a) => if a = d then some none else some (some (τ a))'''

[[mutant]]
name = '''recurrence coefficient off by one'''
file = "../LeanProofs/Stanley/PermCount.lean"
old = '''(Fintype.card α + 1) * ((if all then 1 else 0) + Fintype.card α) * Qc α all m'''
new = '''(Fintype.card α + 1) * ((if all then 1 else 0) + Fintype.card α + 1) * Qc α all m'''

[[mutant]]
name = '''Foulkes value off by one'''
file = "../LeanProofs/Stanley/PermCycles.lean"
old = '''      then (E (univ.filter (fun q : cyc w => Odd (len w q))).card : ℤ) ^ 2 else 0 := by
  have : Nonempty'''
new = '''      then (E (univ.filter (fun q : cyc w => Odd (len w q))).card : ℤ) ^ 2 + 1 else 0 := by
  have : Nonempty'''

[[mutant]]
name = '''odd cycles strictly fewer than points'''
file = "../LeanProofs/Stanley/StanleyProof.lean"
old = '''theorem oddC_le {n : ℕ} (w : Perm (Fin n)) : oddC w ≤ n := by'''
new = '''theorem oddC_le {n : ℕ} (w : Perm (Fin n)) : oddC w < n := by'''

[[mutant]]
name = '''rises read as falls'''
file = "../LeanProofs/Stanley/TwoBlocks.lean"
old = '''(⟨i, by omega⟩ : Fin n) ∉ A ∧ (⟨i+1,h⟩ : Fin n) ∈ A'''
new = '''(⟨i, by omega⟩ : Fin n) ∈ A ∧ (⟨i+1,h⟩ : Fin n) ∉ A'''

[[mutant]]
name = '''Gale-Ryser bound with |R|-1'''
file = "../LeanProofs/Stanley/DominanceNecessity.lean"
old = '''∑ j : Fin (n+1), min R.card (fib (blk n B) j)'''
new = '''∑ j : Fin (n+1), min (R.card-1) (fib (blk n B) j)'''

[[mutant]]
name = '''gap counts T = empty as well'''
file = "../LeanProofs/Stanley/LowerGap.lean"
old = '''theorem f_add_le (n : ℕ) : f n + (2 ^ (n - 1) - 1) ≤ 4 ^ (n - 1) := by'''
new = '''theorem f_add_le (n : ℕ) : f n + 2 ^ (n - 1) ≤ 4 ^ (n - 1) := by'''

[[mutant]]
name = '''gap rate 2^n instead of 2^(n-1)'''
file = "../LeanProofs/Stanley/LowerGap.lean"
old = '''((2 : ℝ) ^ (n - 1) - 1) / 4 ^ (n - 1) ≤ 1 - (f n : ℝ) / 4 ^ (n - 1)'''
new = '''((2 : ℝ) ^ n - 1) / 4 ^ (n - 1) ≤ 1 - (f n : ℝ) / 4 ^ (n - 1)'''

[[mutant]]
name = '''forward rule does not bump to the next row'''
file = "../LeanProofs/Stanley/GrowthForward.lean"
old = '''if r = s then (some (r + 1), some (r + 1)) else'''
new = '''if r = s then (some r, some r) else'''

[[mutant]]
name = '''cross starts a box in row 1'''
file = "../LeanProofs/Stanley/GrowthForward.lean"
old = '''  | _, _, true => (some 0, some 0)'''
new = '''  | _, _, true => (some 1, some 1)'''

[[mutant]]
name = '''crosses of the inverse permutation'''
file = "../LeanProofs/Stanley/GrowthForward.lean"
old = '''decide (i < n ∧ wf w i = j)'''
new = '''decide (j < n ∧ wf w j = i)'''

[[mutant]]
name = '''both descent sets read from one tableau'''
file = "../LeanProofs/Stanley/GrowthForward.lean"
old = '''(∀ r, cnt u n r = cnt v n r) ∧ asc n u = S ∧ asc n v = T := by'''
new = '''(∀ r, cnt u n r = cnt v n r) ∧ asc n u = S ∧ asc n u = T := by'''

[[mutant]]
name = '''block of |S| instead of |S|+1'''
file = "../LeanProofs/Stanley/BlockObstruction.lean"
old = '''(hT : ∀ j ≤ S.card, i + j ∈ T) : (S, T) ∉ pairs n'''
new = '''(hT : ∀ j < S.card, i + j ∈ T) : (S, T) ∉ pairs n'''

[[mutant]]
name = '''descent strictly inside the interval'''
file = "../LeanProofs/Stanley/BlockObstruction.lean"
old = '''    (h : w ⟨b, hb⟩ < w ⟨a, by omega⟩) : ∃ q ∈ descP w, a ≤ q ∧ q < b := by'''
new = '''    (h : w ⟨b, hb⟩ < w ⟨a, by omega⟩) : ∃ q ∈ descP w, a < q ∧ q < b := by'''

[[mutant]]
name = '''gap 3^(n-1) without the -1'''
file = "../LeanProofs/Stanley/BlockObstruction.lean"
old = '''theorem f_add_three_pow_le (n : ℕ) : f n + (3 ^ (n - 1) - 1) ≤ 4 ^ (n - 1) := by'''
new = '''theorem f_add_three_pow_le (n : ℕ) : f n + 3 ^ (n - 1) ≤ 4 ^ (n - 1) := by'''

[[mutant]]
name = '''rate 1/140 claimed'''
file = "../LeanProofs/Stanley/DensitySharp.lean"
old = '''    1 - (f n : ℝ) / 4 ^ (n - 1) ≤ 6 * Real.exp (-(n : ℝ) / 150) := by'''
new = '''    1 - (f n : ℝ) / 4 ^ (n - 1) ≤ 6 * Real.exp (-(n : ℝ) / 140) := by'''

[[mutant]]
name = '''changes at most 2G (drops the +1)'''
file = "../LeanProofs/Stanley/DensitySharp.lean"
old = '''    (chg m K X).card ≤ 2 * (ups m K X).card + 1 := by'''
new = '''    (chg m K X).card ≤ 2 * (ups m K X).card := by'''

[[mutant]]
name = '''change map uses and instead of xor'''
file = "../LeanProofs/Stanley/DensitySharp.lean"
old = '''  fun i => if m + 1 ≤ i.1 then xor (ω i) (ω (prev i)) else ω i'''
new = '''  fun i => if m + 1 ≤ i.1 then (ω i) && (ω (prev i)) else ω i'''

[[mutant]]
name = '''size gap n/6 instead of n/12'''
file = "../LeanProofs/Stanley/DensitySharp.lean"
old = '''    (hdiff : |(S.card : ℝ) - T.card| ≤ n / 12) : (S, T) ∈ pairs n := by'''
new = '''    (hdiff : |(S.card : ℝ) - T.card| ≤ n / 6) : (S, T) ∈ pairs n := by'''

[[mutant]]
name = '''union bound with C(n,j) instead of C(n,j)^2'''
file = "../LeanProofs/Stanley/GaleRyserRate.lean"
old = '''    (bigBlocks n j y).card * 2 ^ y ≤ (n.choose j) ^ 2 * 2 ^ (n - 1) := by'''
new = '''    (bigBlocks n j y).card * 2 ^ y ≤ n.choose j * 2 ^ (n - 1) := by'''

[[mutant]]
name = '''last positions miss the final block'''
file = "../LeanProofs/Stanley/GaleRyserRate.lean"
old = '''  (range n).filter (fun i => block A i ∈ R ∧ (i + 1 = n ∨ i ∈ A))'''
new = '''  (range n).filter (fun i => block A i ∈ R ∧ i ∈ A)'''

[[mutant]]
name = '''|A|+2 nonempty blocks claimed'''
file = "../LeanProofs/Stanley/GaleRyserRate.lean"
old = '''    A.card + 1 ≤ ((range (n + 1)).filter (fun j => 0 < blen n A j)).card := by'''
new = '''    A.card + 2 ≤ ((range (n + 1)).filter (fun j => 0 < blen n A j)).card := by'''

[[mutant]]
name = '''large regime claims r <= k+e-2'''
file = "../LeanProofs/Stanley/GaleRyserRate.lean"
old = '''      ∃ k ∈ Ioo m n, ∃ e ∈ Icc 1 n, A.card + 2 ≤ k + e ∧ e ≤ excess n B k := by'''
new = '''      ∃ k ∈ Ioo m n, ∃ e ∈ Icc 1 n, A.card + 3 ≤ k + e ∧ e ≤ excess n B k := by'''

[[mutant]]
name = '''tail of E_k with 2n^2 instead of 4n^2'''
file = "../LeanProofs/Stanley/GaleRyserRate.lean"
old = '''      4 * n ^ 2 * 2 ^ (n - 1) * (1 / 2) ^ (k + e) := by'''
new = '''      2 * n ^ 2 * 2 ^ (n - 1) * (1 / 2) ^ (k + e) := by'''

[[mutant]]
name = '''block of |S| violates (3.2)'''
file = "../LeanProofs/Stanley/GaleRyserRate.lean"
old = '''    (h : range (S.card + 1) ⊆ T) : ¬ RunDominance n S (complementCuts n T) := by'''
new = '''    (h : range S.card ⊆ T) : ¬ RunDominance n S (complementCuts n T) := by'''

[[mutant]]
name = '''upper bound with 2n^3 instead of 4n^3'''
file = "../LeanProofs/Stanley/GaleRyserRate.lean"
old = '''      (4 * n ^ 3 + 2 ^ (Nat.clog 2 (n ^ 2) + 1 - 1) *'''
new = '''      (2 * n ^ 3 + 2 ^ (Nat.clog 2 (n ^ 2) + 1 - 1) *'''

[[mutant]]
name = '''lower bound without the -1'''
file = "../LeanProofs/Stanley/GaleRyserRate.lean"
old = '''    ((3 : ℝ) ^ (n - 1) - 1) / 4 ^ (n - 1) ≤ (grBad n).card / 4 ^ (n - 1) ∧'''
new = '''    ((3 : ℝ) ^ (n - 1)) / 4 ^ (n - 1) ≤ (grBad n).card / 4 ^ (n - 1) ∧'''

[[mutant]]
name = '''asymptotic lower bound (3/4)^n'''
file = "../LeanProofs/Stanley/GaleRyserRate.lean"
old = '''    (3 / 4 : ℝ) ^ (n + 1) ≤ (grBad n).card / 4 ^ (n - 1) ∧'''
new = '''    (3 / 4 : ℝ) ^ n ≤ (grBad n).card / 4 ^ (n - 1) ∧'''

[[mutant]]
name = '''Corollary 3.7 counts failures twice'''
file = "../LeanProofs/Stanley/GaleRyserRate.lean"
old = '''    1 - (Stanley.f n : ℝ) / 4 ^ (n - 1) = (grBad n).card / 4 ^ (n - 1) := by'''
new = '''    1 - (Stanley.f n : ℝ) / 4 ^ (n - 1) = 2 * (grBad n).card / 4 ^ (n - 1) := by'''
