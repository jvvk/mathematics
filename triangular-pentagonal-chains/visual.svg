<text x="360" y="258" font-size="15" fill="#1d1c1a">How every length is reached</text>
<text x="360" y="284" font-size="17" fill="#b7791f">49·T(k) + 6 = T(7k + 3)</text>
<text x="360" y="310" font-size="13" fill="#6b6860">inflate a chain on 1..n to about 49n numbers,</text>
<text x="360" y="336" font-size="13" fill="#6b6860">stitch 49 inflated copies with 1..27,</text>
<text x="360" y="362" font-size="13" fill="#6b6860">keep each number at a position of its own parity.</text>
<text x="360" y="402" font-size="13" fill="#1d1c1a">Pentagonal sums: chains for n ≥ 4,</text>
<text x="360" y="428" font-size="13" fill="#1d1c1a">necklaces for n ≥ 9.</text>
