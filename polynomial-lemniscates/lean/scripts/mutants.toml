# Mutation suite for LeanProofs/Lemniscates (MSE 1250327). Replaces mutants.py.
# Run (from lean/, after lake build): python3 -I scripts/mutate.py scripts/mutants.toml
# In place: each mutant edits one statement in its source file, compiles that file against the built tree, and
# restores it. A rejection needs a nonzero exit AND a Lean error located in the mutated file; timeouts and crashes
# are inconclusive and fail the run. Every mutant is a false statement (not merely one the unchanged proof misses);
# full output of every run is kept in mutation-logs/.
[check]
cmd = ["lake", "env", "lean", "{file}"]
cwd = ".."
timeout = 900
mode = "inplace"
fail_pattern = 'LeanProofs/Lemniscates/\S+\.lean:\d+:\d+: error'
diagnostic_in_target = true
log_dir = "../mutation-logs"

[[mutant]]
name = '''[Pairing] (S.filter (fun p => σ p = p)).card ≤ 5 := by'''
file = "../LeanProofs/Lemniscates/Pairing.lean"
old = '''(S.filter (fun p => σ p = p)).card ≤ 6 := by'''
new = '''(S.filter (fun p => σ p = p)).card ≤ 5 := by'''

