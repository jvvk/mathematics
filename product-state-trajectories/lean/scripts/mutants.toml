old = "theorem maxent (S : Finset ℝ) (W : ℝ → M2) (hW : ∀ s ∈ S, W s ≠ 0)\n    (horth : ∀ s ∈ S, ∀ s' ∈ S, s ≠ s' → ip (W s) (W s') = 0)\n    (hmax"
new = "theorem maxent (S : Finset ℝ) (W : ℝ → M2) (hW : ∀ s ∈ S, W s ≠ 0)\n    (hmax"

[[mutant]]
name = "MaxEnt: maxent without maximal entanglement"
file = "../LeanProofs/ProductTrajectory/MaxEnt.lean"
old = "    (hmax : ∀ t : ℝ, ∃ r : ℂ, Nt S W t * (Nt S W t)ᴴ = r • 1) :"
new = "    :"

[[mutant]]
name = "MaxEnt: generator with pairing s -> kappa + s"
file = "../LeanProofs/ProductTrajectory/MaxEnt.lean"
old = "    (hpair : ∀ s ∈ S, κ - s ∈ S ∧ tau (W (κ - s)) = W s) :"
new = "    (hpair : ∀ s ∈ S, κ + s ∈ S ∧ tau (W (κ + s)) = W s) :"
