new = "    (h : ∀ t : ℝ, ∑ ν ∈ Nν,"

[[mutant]]
name = "Heisenberg: non-locality without Hermitian C"
file = "../LeanProofs/ProductTrajectory/Heisenberg.lean"
old = "theorem not_local : ¬ ∃ A C : Matrix (Fin 2) (Fin 2) ℂ, A.IsHermitian ∧ C.IsHermitian ∧"
new = "theorem not_local : ¬ ∃ A C : Matrix (Fin 2) (Fin 2) ℂ, A.IsHermitian ∧"

[[mutant]]
name = "SO4: so(4) split with a wrong coefficient"
file = "../LeanProofs/ProductTrajectory/SO4.lean"
old = "(((ω 0 3 + ω 1 2) / 2 : ℝ) : ℂ) • σx"
new = "(((ω 0 3 + ω 1 2) / 3 : ℝ) : ℂ) • σx"

[[mutant]]
name = "SO4: tau_fixed without the determinant hypothesis"
file = "../LeanProofs/ProductTrajectory/SO4.lean"
old = "(hXX : X * Xᴴ = r • 1) (hdet : X.det = r) :"
new = "(hXX : X * Xᴴ = r • 1) :"

[[mutant]]
name = "SO4: quaternion structure with a wrong sign"
file = "../LeanProofs/ProductTrajectory/SO4.lean"
old = "def tau (X : M2) : M2 := !![star (X 1 1), -star (X 1 0); -star (X 0 1), star (X 0 0)]"
new = "def tau (X : M2) : M2 := !![star (X 1 1), star (X 1 0); -star (X 0 1), star (X 0 0)]"

[[mutant]]
name = "ExpSums: constant modulus without nonzero coefficients"
file = "../LeanProofs/ProductTrajectory/ExpSums.lean"
old = "theorem const_modulus_single (S : Finset ℝ) (c : ℝ → ℂ) (hc : ∀ s ∈ S, c s ≠ 0) (hS : S.Nonempty)"
new = "theorem const_modulus_single (S : Finset ℝ) (c : ℝ → ℂ) (hS : S.Nonempty)"

[[mutant]]
name = "ExpSums: coefficient uniqueness claims c = -d"
file = "../LeanProofs/ProductTrajectory/ExpSums.lean"
old = "(h : ∀ t : ℝ, ∑ s ∈ S, c s * ch s t = ∑ s ∈ S, d s * ch s t) : ∀ s ∈ S, c s = d s := by"
new = "(h : ∀ t : ℝ, ∑ s ∈ S, c s * ch s t = ∑ s ∈ S, d s * ch s t) : ∀ s ∈ S, c s = -d s := by"

[[mutant]]
name = "MaxEnt: maxent without orthogonality"
