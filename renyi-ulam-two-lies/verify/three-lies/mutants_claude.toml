# Mutation suite for claude_check_counterexample.py: each mutant plants one false claim; the checker must reject every one.
#   python3 -I ../../lean/scripts/mutate.py mutants_claude.toml
[check]
cmd = ["python3", "-I", "run_check.py", "claude_check_counterexample.py"]
cwd = "."
timeout = 600
mode = "inplace"
fail_markers = ["AssertionError"]

