<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Georgia, 'Times New Roman', serif">
  <rect width="760" height="300" rx="10" fill="#fbfaf7"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <!-- parent -->
  <rect x="290" y="22" width="180" height="40" rx="8" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
  <text x="380" y="48" text-anchor="middle" font-size="18" fill="#1f1f1f">(2a, 2b, 0)</text>
  <!-- edges -->
  <line x1="340" y1="62" x2="190" y2="122" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="420" y1="62" x2="570" y2="122" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="245" y="84" font-size="15" fill="#555">yes</text>
  <text x="498" y="84" font-size="15" fill="#555">no</text>
  <!-- children -->
  <rect x="40" y="124" width="270" height="44" rx="8" fill="#eef3fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="175" y="152" text-anchor="middle" font-size="16" fill="#1f1f1f">Y = (a+d, a+b+f−d, b−f)</text>
  <rect x="450" y="124" width="270" height="44" rx="8" fill="#eef3fb" stroke="#2f5d9e" stroke-width="1.5"/>
  <text x="585" y="152" text-anchor="middle" font-size="16" fill="#1f1f1f">N = (a−d, a+b−f+d, b+f)</text>
  <!-- midpoint -->
  <line x1="200" y1="168" x2="330" y2="214" stroke="#9a6a1f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="560" y1="168" x2="430" y2="214" stroke="#9a6a1f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="250" y="214" width="260" height="44" rx="8" fill="#fbf1e1" stroke="#9a6a1f" stroke-width="2"/>
  <text x="380" y="242" text-anchor="middle" font-size="17" fill="#1f1f1f">h = (a, a+b, b) = ½(Y + N)</text>
  <text x="380" y="284" text-anchor="middle" font-size="14" fill="#444">V(Y) = V(h) + δ,  V(N) = V(h) − δ;  a congruence forces δ = f, so h wins whenever the parent does</text>
</svg>
