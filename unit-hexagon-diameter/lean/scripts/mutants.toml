new = '''(hfd : 0 < cross f d) (heb : 0 < cross e b) (hed : 0 < cross e b) :'''

[[mutant]]
name = '''sharp: sign identity with 3t'''
file = "../LeanProofs/UnitHexagon/Sharpness.lean"
old = '''2 * Ey t - r2 t = 16 * t * (1 - 2 * t) / (5 * (1 + t ^ 2))'''
new = '''2 * Ey t - r2 t = 16 * t * (1 - 3 * t) / (5 * (1 + t ^ 2))'''

[[mutant]]
name = '''sharp: D off the unit circle about C'''
file = "../LeanProofs/UnitHexagon/Sharpness.lean"
old = '''def Dx (t : ℝ) : ℝ := 2 * t ^ 2 / (1 + t ^ 2)'''
new = '''def Dx (t : ℝ) : ℝ := 3 * t ^ 2 / (1 + t ^ 2)'''

[[mutant]]
name = '''sharp: limit k = 1'''
file = "../LeanProofs/UnitHexagon/Sharpness.lean"
old = '''lemma kk_zero : kk 0 = 3 / 2 := by'''
new = '''lemma kk_zero : kk 0 = 1 := by'''

[[mutant]]
name = '''sharp: E convex'''
file = "../LeanProofs/UnitHexagon/Sharpness.lean"
old = '''    cross (V t 4 - V t 3) (V t 5 - V t 4) < 0 ∧'''
new = '''    0 < cross (V t 4 - V t 3) (V t 5 - V t 4) ∧'''

[[mutant]]
name = '''sharp: diameter limit below 2'''
file = "../LeanProofs/UnitHexagon/Sharpness.lean"
old = '''    (∀ i j, d2 (V t i) (V t j) < 2 + ε) ∧'''
new = '''    (∀ i j, d2 (V t i) (V t j) < 3 / 2 + ε) ∧'''
