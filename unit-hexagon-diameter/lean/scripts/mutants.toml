new = '''(hsum : ∑ i, ι i = 6 * π) : R.card = 2'''

[[mutant]]
name = '''rays: wrong weight in the triangle turn'''
file = "../LeanProofs/UnitHexagon/Rays.lean"
old = '''cross (F - E) (A - F) = -μ * orient A C E ∧'''
new = '''cross (F - E) (A - F) = -ν * orient A C E ∧'''

[[mutant]]
name = '''rays: d need not be inside the hull'''
file = "../LeanProofs/UnitHexagon/Rays.lean"
