# Implementation mutants for verify_paper.py: each plants one error in the code (not in a claim) and the
# unchanged checks must then fail. (Dropping only i = n is an equivalent mutant: a_n + a_0 = a_0 + a_n.) Run: python3 -I harness/mutate.py mutants.toml
[check]
cmd = ["python3", "-I", "{file}"]
cwd = "."
timeout = 600

[[mutant]]
name = "mex starts counting at 1"
file = "verify_paper.py"
old = "    v = 0\n    while v in s:"
new = "    v = 1\n    while v in s:"

[[mutant]]
name = "rule skips the end pairs (a_0 + a_n never enters the set)"
file = "verify_paper.py"
old = "        a.append(mex({a[i] + a[n - i] for i in range(n + 1)}))"
new = "        a.append(mex({a[i] + a[n - i] for i in range(1, n)}))"

[[mutant]]
name = "closed form: twin slope 5 per three blocks"
file = "verify_paper.py"
old = "+ 4 * ((b - 3) // 3)"
new = "+ 5 * ((b - 3) // 3)"

[[mutant]]
name = "closed form: last column 3"
file = "verify_paper.py"
old = "    return [1, 3, 3][b] if b < 3 else 2"
new = "    return [1, 3, 3][b] if b < 3 else 3"

[[mutant]]
name = "starting word ends in 0"
file = "verify_paper.py"
old = "A = mex_seq([1, 1, 1, 0, 1, 0, 1, 1], 3000)"
new = "A = mex_seq([1, 1, 1, 0, 1, 0, 1, 0], 3000)"

[[mutant]]
name = "zero residues 0 and 2 in the Lemma 1 check"
file = "verify_paper.py"
old = "(A[m] == 0) == (m % 5 in (0, 3))"
new = "(A[m] == 0) == (m % 5 in (0, 2))"
