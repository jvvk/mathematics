<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Georgia, serif">
<rect width="760" height="300" fill="white"/>
<text x="380" y="38" text-anchor="middle" font-size="22">walks on the slit plane ending at (0, 1):  a(2n+1) = 4ⁿ Cₙ</text>
<text x="380" y="64" text-anchor="middle" font-size="14" fill="#555">Stanley's bijective proof problems 236–237 [?] · combinatorial proofs by cycle sorting and sign-reversing involutions</text>
<g transform="translate(60,90)">
  <g stroke="#e3e3e3"><line x1="0" y1="20" x2="200" y2="20"/><line x1="0" y1="60" x2="200" y2="60"/><line x1="0" y1="100" x2="200" y2="100"/><line x1="0" y1="140" x2="200" y2="140"/><line x1="0" y1="180" x2="200" y2="180"/>
  <line x1="20" y1="0" x2="20" y2="190"/><line x1="60" y1="0" x2="60" y2="190"/><line x1="100" y1="0" x2="100" y2="190"/><line x1="140" y1="0" x2="140" y2="190"/><line x1="180" y1="0" x2="180" y2="190"/></g>
  <line x1="0" y1="100" x2="100" y2="100" stroke="#a11" stroke-width="5"/>
  <polyline points="100,100 140,100 140,60 100,60" fill="none" stroke="#1f5fa8" stroke-width="3"/>
  <circle cx="100" cy="100" r="5" fill="#222"/><circle cx="100" cy="60" r="5" fill="#1f5fa8"/>
  <text x="30" y="122" font-size="13" fill="#a11">forbidden</text>
  <text x="100" y="212" text-anchor="middle" font-size="13" fill="#555">n = 1: ENW (drawn), NEW, NWE, NNS</text>
</g>
<g font-size="15">
  <text x="320" y="118">barred loops  =  signed pairs of Dyck paths</text>
  <text x="320" y="142" font-size="13" fill="#555">cut at axis visits, sort into cycles, cancel odd cycles</text>
  <text x="320" y="180">primitive loops:  P₂ᵣ = 2C₂ᵣ₋₁ + L₂ᵣ₋₂</text>
  <text x="320" y="204" font-size="13" fill="#555">append / remove the last primitive piece</text>
  <text x="320" y="242">a₀,₁(2n+1)  =  Σ C₂ₖ C₂ₙ₋₂ₖ  =  4ⁿ Cₙ</text>
  <text x="320" y="266" font-size="13" fill="#555">close the walk by one step; Shapiro's identity (Hajnal–Nagy)</text>
</g>
</svg>
