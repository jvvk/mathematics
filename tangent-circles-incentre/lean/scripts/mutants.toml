# Mutation suite for LeanProofs/TangentCircles (MO 498968). Replaces mutants.py.
# Run (from lean/, after lake build): python3 -I scripts/mutate.py scripts/mutants.toml
# Copy mode: each mutant plants one wrong change in a copy of its source file, compiled against the built tree.
# A rejection needs a nonzero exit AND a Lean error located in the mutated copy; timeouts and crashes are
# inconclusive and fail the run. Full output of every run is kept in mutation-logs/.
[check]
cmd = ["lake", "env", "lean", "{file}"]
cwd = ".."
timeout = 900
mode = "copy"
fail_pattern = 'TangentCircles/\S+Mut\.lean:\d+:\d+: error'
diagnostic_in_target = true
log_dir = "../mutation-logs"

[[mutant]]
name = '''half-chord A: wrong sign of 2p'''
file = "../LeanProofs/TangentCircles/Chords.lean"
old = '''      a ^ 2 * Real.cos ω * Real.cos (ω - 2 * p) := by'''
new = '''      a ^ 2 * Real.cos ω * Real.cos (ω + 2 * p) := by'''

[[mutant]]
name = '''half-chord B: wrong sign of 2q'''
file = "../LeanProofs/TangentCircles/Chords.lean"
old = '''      b ^ 2 * Real.cos ω * Real.cos (ω + 2 * q) := by'''
new = '''      b ^ 2 * Real.cos ω * Real.cos (ω - 2 * q) := by'''

[[mutant]]
name = '''midpoints: sum has sin term'''
file = "../LeanProofs/TangentCircles/Chords.lean"
old = '''
      (a + b) * Real.cos ω := by
  ring'''
new = '''
      (a + b) * Real.cos ω + z * Real.sin ω := by
  ring'''

[[mutant]]
name = '''product: plus sin squared'''
file = "../LeanProofs/TangentCircles/Chords.lean"
old = '''      Real.cos (p + q) ^ 2 - Real.sin η ^ 2 := by'''
new = '''      Real.cos (p + q) ^ 2 + Real.sin η ^ 2 := by'''

[[mutant]]
name = '''tidy: swapped weights'''
file = "../LeanProofs/TangentCircles/Chords.lean"
old = '''      b * Real.cos p ^ 2 + a * Real.cos q ^ 2 := by'''
new = '''      a * Real.cos p ^ 2 + b * Real.cos q ^ 2 := by'''

[[mutant]]
name = '''integral: 2 pi'''
file = "../LeanProofs/TangentCircles/Integral.lean"
old = '''theorem integral_g : ∫ η in -(π / 2 - |s|)..(π / 2 - |s|), g s η = π := by'''
new = '''theorem integral_g : ∫ η in -(π / 2 - |s|)..(π / 2 - |s|), g s η = 2 * π := by'''

[[mutant]]
name = '''integral: derivative without the square root'''
file = "../LeanProofs/TangentCircles/Integral.lean"
old = '''noncomputable def g (s η : ℝ) : ℝ := Real.cos η / Real.sqrt (Real.cos s ^ 2 - Real.sin η ^ 2)'''
new = '''noncomputable def g (s η : ℝ) : ℝ := Real.cos η / (Real.cos s ^ 2 - Real.sin η ^ 2)'''

[[mutant]]
name = '''density: Cauchy(a) only'''
file = "../LeanProofs/TangentCircles/Crossing.lean"
old = '''noncomputable def f (a b z : ℝ) : ℝ := (1 / π) * (a / (a ^ 2 + z ^ 2) + b / (b ^ 2 + z ^ 2))'''
new = '''noncomputable def f (a b z : ℝ) : ℝ := (1 / π) * (2 * a / (a ^ 2 + z ^ 2))'''

[[mutant]]
name = '''half mass: pi/3'''
file = "../LeanProofs/TangentCircles/Crossing.lean"
old = '''    Real.arctan (Real.sqrt (a * b) / a) + Real.arctan (Real.sqrt (a * b) / b) = π / 2 := by'''
new = '''    Real.arctan (Real.sqrt (a * b) / a) + Real.arctan (Real.sqrt (a * b) / b) = π / 3 := by'''

[[mutant]]
name = '''half: 2/3'''
file = "../LeanProofs/TangentCircles/Crossing.lean"
old = '''    ∫ z in (0 : ℝ)..Real.sqrt (a * b), f a b z = 1 / 2 := by'''
new = '''    ∫ z in (0 : ℝ)..Real.sqrt (a * b), f a b z = 2 / 3 := by'''

[[mutant]]
name = '''tail: wrong sign'''
file = "../LeanProofs/TangentCircles/Crossing.lean"
old = '''
      1 / 2 - (Real.arctan (r / a) + Real.arctan (r / b)) / π := by
  rw [integral_f'''
new = '''
      1 / 2 + (Real.arctan (r / a) + Real.arctan (r / b)) / π := by
  rw [integral_f'''

[[mutant]]
name = '''density form: cos(p+q)'''
file = "../LeanProofs/TangentCircles/Crossing.lean"
old = '''
    (a + b) * Real.cos p * Real.cos q * Real.cos (p - q) / (a * b) =
      a / (a ^ 2 + z ^ 2)'''
new = '''
    (a + b) * Real.cos p * Real.cos q * Real.cos (p + q) / (a * b) =
      a / (a ^ 2 + z ^ 2)'''

[[mutant]]
name = '''incircle: Heron with a + b'''
file = "../LeanProofs/TangentCircles/Incircle.lean"
old = '''  (hheron : ρ ^ 2 * (a + b + c) = a * b * c)'''
new = '''  (hheron : ρ ^ 2 * (a + b) = a * b * c)'''

[[mutant]]
name = '''incircle: half-angles sum to pi'''
file = "../LeanProofs/TangentCircles/Incircle.lean"
old = '''    Real.arctan (ρ / a) + Real.arctan (ρ / b) + Real.arctan (ρ / c) = π / 2 := by'''
new = '''    Real.arctan (ρ / a) + Real.arctan (ρ / b) + Real.arctan (ρ / c) = π := by'''

[[mutant]]
name = '''incircle: total miss 1/3'''
file = "../LeanProofs/TangentCircles/Incircle.lean"
old = '''    (1 / 2 - (Real.arctan (ρ / c) + Real.arctan (ρ / a)) / π) = 1 / 2 := by'''
new = '''    (1 / 2 - (Real.arctan (ρ / c) + Real.arctan (ρ / a)) / π) = 1 / 3 := by'''

[[mutant]]
name = '''sphere: fold without the factor 2'''
file = "../LeanProofs/TangentCircles/Sphere.lean"
old = '''Real.cos (d + -η) / Real.cos (-η) = 2 * Real.cos d := by'''
new = '''Real.cos (d + -η) / Real.cos (-η) = Real.cos d := by'''

[[mutant]]
name = '''sphere: lune of width pi - C'''
file = "../LeanProofs/TangentCircles/Sphere.lean"
old = '''lemma lune {s α β γ : ℝ} (h : α + β + γ = π / 2) : α + β < s ↔ π - 2 * γ < 2 * s := by'''
new = '''lemma lune {s α β γ : ℝ} (h : α + β + γ = π / 2) : α + β < s ↔ 2 * γ < 2 * s := by'''
