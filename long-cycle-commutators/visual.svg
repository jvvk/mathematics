<text x="380" y="40" text-anchor="middle" font-size="22">#{(u,v) : u v u⁻¹ v⁻¹ = (1 2 … n)} = 2n · n! / (n+1)</text>
<text x="380" y="70" text-anchor="middle" font-size="14" fill="#555">n odd · Stanley's bijective proof problem 84 [*] · proved by sign-reversing involutions</text>
