# Mutation suite for LeanProofs/Hankel456683 (MO 456683, Johann Cigler: D_{k,n}(x,c) = det(a_{i+j,k}(x,c))
# does not depend on c and equals det H_{k,n}(x), for all k, n).
# Run from anywhere:
#   cd lean && python3 -I scripts/mutate.py scripts/mutants.toml [--only "[Defs]" | "[Walks]" | "[Step1]" | ...]
# Inplace mode: a mutated definition must reach every downstream module, so each check rebuilds the
# LeanProofs.Hankel456683 tree. After the run, `lake build LeanProofs.Hankel456683` restores the
# .olean files. At least one mutant per named theorem and definition; each one is a wrong claim.
# Parts (one per file, each under 10 minutes): [Defs] [Walks] [Step1] [Step2] [Step3] [Headline].
[check]
cmd = ["lake", "build", "LeanProofs.Hankel456683"]
cwd = ".."
timeout = 900
mode = "inplace"
fail_markers = ["error"]

[[mutant]]
name = '''[Defs] walk: horizontal weight s k -> s (k+1) (wrong height of the level step)'''
file = "../LeanProofs/Hankel456683/Defs.lean"
old = '''+ s k * walk s n l k +'''
new = '''+ s (k + 1) * walk s n l k +'''

[[mutant]]
name = '''[Defs] walk: start [l = k] -> [l = k + 1]'''
file = "../LeanProofs/Hankel456683/Defs.lean"
old = '''| 0, l, k => if l = k then 1 else 0'''
new = '''| 0, l, k => if l = k + 1 then 1 else 0'''

[[mutant]]
name = '''[Defs] ciglerS: s_0 = c + x -> s_0 = c (x dropped)'''
file = "../LeanProofs/Hankel456683/Defs.lean"
