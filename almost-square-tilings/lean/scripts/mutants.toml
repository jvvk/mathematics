# Mutation suite for AlmostSquares (Friedman #20). Replaces mutants.sh.
# Run (from lean/, after lake build): python3 -I scripts/mutate.py scripts/mutants.toml
# Copy mode: each mutant plants one wrong change in a copy of its source file, compiled against the built tree
# with one thread. A rejection needs a nonzero exit AND a Lean error located in the mutated copy; timeouts and
# crashes are inconclusive and fail the run. Full output of every run is kept in mutation-logs/.
[check]
cmd = ["lake", "env", "lean", "--threads=1", "{file}"]
cwd = ".."
timeout = 900
mode = "copy"
fail_pattern = 'AlmostSquares/\S+Mut\.lean:\d+:\d+: error'
diagnostic_in_target = true
log_dir = "../mutation-logs"

[[mutant]]
name = '''balance: right side (f W - f 0) -> f W'''
file = "../AlmostSquares/Inflation.lean"
old = '''      (f W - f 0) * (g H - g 0) := by'''
new = '''      f W * (g H - g 0) := by'''

