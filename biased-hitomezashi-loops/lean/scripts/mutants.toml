# Mutation suite for the biased hitomezashi loop-density formalisation.
# python3 -I ~/.claude/skills/mutation-harness/mutate.py scripts/hitomezashi_biased_mutants.toml
[check]
cmd = ["lake", "env", "lean", "{file}"]
cwd = ".."
timeout = 900
fail_markers = ["error"]

[[mutant]]
name = "density: constant -5/4 to -1"
file = "../LeanProofs/HitomezashiBiased/Series.lean"
old = "  2 * p * (1 - p) - 5 / 4 + π ^ 2 * (p * (1 - p)) ^ 2 / 6 * (2 + 3 / Real.sin (π * p) ^ 2) +"
new = "  2 * p * (1 - p) - 4 / 4 + π ^ 2 * (p * (1 - p)) ^ 2 / 6 * (2 + 3 / Real.sin (π * p) ^ 2) +"

[[mutant]]
name = "density: csc^2 coefficient 3 to 2"
file = "../LeanProofs/HitomezashiBiased/Series.lean"
old = "  2 * p * (1 - p) - 5 / 4 + π ^ 2 * (p * (1 - p)) ^ 2 / 6 * (2 + 3 / Real.sin (π * p) ^ 2) +"
new = "  2 * p * (1 - p) - 5 / 4 + π ^ 2 * (p * (1 - p)) ^ 2 / 6 * (2 + 2 / Real.sin (π * p) ^ 2) +"

[[mutant]]
name = "density: cot coefficient 1-3pq to 1-2pq"
file = "../LeanProofs/HitomezashiBiased/Series.lean"
old = "    π * p * (1 - p) * (1 - 3 * p * (1 - p)) * Real.cot (π * p) / (1 - 2 * p)"
new = "    π * p * (1 - p) * (1 - 2 * p * (1 - p)) * Real.cot (π * p) / (1 - 2 * p)"

[[mutant]]
name = "main theorem: exclude 1/3 instead of 1/2"
file = "../LeanProofs/HitomezashiBiased/Series.lean"
old = "theorem hasSum_density {p : ℝ} (hp0 : 0 < p) (hp1 : p < 1) (hp : p ≠ 1 / 2) :"
new = "theorem hasSum_density {p : ℝ} (hp0 : 0 < p) (hp1 : p < 1) (hp : p ≠ 1 / 3) :"

[[mutant]]
name = "fair case: (pi^2-8)/12"
file = "../LeanProofs/HitomezashiBiased/Series.lean"
old = "theorem hasSum_density_half : HasSum (fun k => X (1 / 2) k ^ 2 / 4) ((π ^ 2 - 9) / 12) := by"
new = "theorem hasSum_density_half : HasSum (fun k => X (1 / 2) k ^ 2 / 4) ((π ^ 2 - 8) / 12) := by"

[[mutant]]
name = "csc^2 series: -2/x^2"
file = "../LeanProofs/HitomezashiBiased/Series.lean"
old = "      (π ^ 2 / Real.sin (π * x) ^ 2 - 1 / x ^ 2) := by"
new = "      (π ^ 2 / Real.sin (π * x) ^ 2 - 2 / x ^ 2) := by"

[[mutant]]
name = "K series: divide by 2x"
file = "../LeanProofs/HitomezashiBiased/Series.lean"
old = "    HasSum (fun n : ℕ => 2 / (((n : ℝ) + 1) ^ 2 - x ^ 2)) ((1 / x - π * Real.cot (π * x)) / x) := by"
new = "    HasSum (fun n : ℕ => 2 / (((n : ℝ) + 1) ^ 2 - x ^ 2)) ((1 / x - π * Real.cot (π * x)) / (2 * x)) := by"

[[mutant]]
name = "casoratian: off-by-one product"
file = "../LeanProofs/HitomezashiBiased/Continuant.lean"
old = "    P a (h + 1) * Q a h - P a h * Q a (h + 1) = ∏ i ∈ range h, a i := by"
new = "    P a (h + 1) * Q a h - P a h * Q a (h + 1) = ∏ i ∈ range (h + 1), a i := by"

[[mutant]]
name = "Q closed form: (j+2) r^j"
file = "../LeanProofs/HitomezashiBiased/Continuant.lean"
old = "    Q (alt (q ^ 2) (p ^ 2)) (2 * j + 1) = (j + 1) * (p * q) ^ j ∧"
new = "    Q (alt (q ^ 2) (p ^ 2)) (2 * j + 1) = (j + 2) * (p * q) ^ j ∧"

[[mutant]]
name = "X_even: swapped pairing"
file = "../LeanProofs/HitomezashiBiased/Continuant.lean"
old = "    X p (2 * j) = p * (1 - p) / (j + 1) * (p / (j + (1 - p)) + (1 - p) / (j + p)) := by"
new = "    X p (2 * j) = p * (1 - p) / (j + 1) * (p / (j + p) + (1 - p) / (j + (1 - p))) := by"

[[mutant]]
name = "X_odd: prefactor 1/(j+2)"
file = "../LeanProofs/HitomezashiBiased/Continuant.lean"
old = "    X p (2 * j + 1) = p * (1 - p) / (j + 1) * ((1 - p) / (j + 1 + (1 - p)) + p / (j + 1 + p)) := by"
new = "    X p (2 * j + 1) = p * (1 - p) / (j + 2) * ((1 - p) / (j + 1 + (1 - p)) + p / (j + 1 + p)) := by"

[[mutant]]
name = "label word: A without the elevating up-step"
file = "../LeanProofs/HitomezashiBiased/LabelWord.lean"
old = "    let A := 1 + cnt ou 0 P"
new = "    let A := cnt ou 0 P"

[[mutant]]
name = "zeros_closed: aligned parity counts odd ups"
file = "../LeanProofs/HitomezashiBiased/LabelWord.lean"
old = "    zerosIdx (ev h) l = 2 * cnt eu h l ∧"
new = "    zerosIdx (ev h) l = 2 * cnt ou h l ∧"

[[mutant]]
name = "vertical label: down-steps without +1"
file = "../LeanProofs/HitomezashiBiased/Parity.lean"
old = "    ((z (t + 1)).2 = (z t).2 - 1 ∧ ε (z t).1 = σ + (z t).1 + 1) := by"
new = "    ((z (t + 1)).2 = (z t).2 - 1 ∧ ε (z t).1 = σ + (z t).1) := by"

[[mutant]]
name = "horizontal label: missing +1"
file = "../LeanProofs/HitomezashiBiased/Parity.lean"
old = "    ((z (t + 1)).1 = (z t).1 + 1 ∧ η (z t).2 = σ + 1 + (z t).2) ∨"
new = "    ((z (t + 1)).1 = (z t).1 + 1 ∧ η (z t).2 = σ + (z t).2) ∨"
