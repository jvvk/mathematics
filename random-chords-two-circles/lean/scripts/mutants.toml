# Mutation suite for RandomChords (MathOverflow 499477). Replaces mutants.sh.
# Run (from lean/, after a full build): python3 -I scripts/mutate.py scripts/mutants.toml
# In place: each mutant edits one statement of a source file, rebuilds through Audit.lean with scripts/lake_serial.py
# (one module at a time; unchanged modules are reused) and restores the file. A mutated definition fails in the
# modules that use it, so the error may be in a dependent file. A rejection needs a nonzero exit AND a Lean error
# in a RandomChords source file; timeouts and crashes are inconclusive and fail the run. Logs in mutation-logs/.
[check]
cmd = ["python3", "-I", "scripts/lake_serial.py", ".", "RandomChords.Audit"]
cwd = ".."
timeout = 2400
mode = "inplace"
fail_pattern = 'RandomChords/\S+\.lean:\d+:\d+: error'
log_dir = "../mutation-logs"

[[mutant]]
name = '''normal of the line not perpendicular'''
file = "../RandomChords/Basic.lean"
old = '''def nrmD (d : ℝ × ℝ) : ℝ × ℝ := (sgn d * -d.2 / len d, sgn d * d.1 / len d)'''
new = '''def nrmD (d : ℝ × ℝ) : ℝ × ℝ := (sgn d * d.2 / len d, sgn d * d.1 / len d)'''

[[mutant]]
name = '''torus mass twice the square'''
file = "../RandomChords/Basic.lean"
old = '''lemma four_mul_volume_sq : 4 * volume sq = volume (univ : Set (Ang × Ang)) := by'''
new = '''lemma four_mul_volume_sq : 2 * volume sq = volume (univ : Set (Ang × Ang)) := by'''

[[mutant]]
name = '''branch theorem: constant c + 1'''
file = "../RandomChords/Branches.lean"
old = '''    Measure.map F volume = c • volume.restrict s ∧'''
new = '''    Measure.map F volume = (c + 1) • volume.restrict s ∧'''

[[mutant]]
