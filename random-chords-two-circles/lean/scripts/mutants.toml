[[mutant]]
name = '''Theorem 4: |QO| = a(a+b)/b'''
file = "../RandomChords/Centres.lean"
old = '''
    Measure.map (dAB a b D q o) volume = Measure.map (dBC b q o) volume ↔
      o = 0 ∨ (D = a + b ∧ o = b * (a + b) / a) := by'''
new = '''
    Measure.map (dAB a b D q o) volume = Measure.map (dBC b q o) volume ↔
      o = 0 ∨ (D = a + b ∧ o = a * (a + b) / b) := by'''

[[mutant]]
name = '''Corollary 5: ab = c^2'''
