file = "../RandomChords/Corollaries.lean"
old = '''      o' = 0 ∨ (D = a + b ∧ o' = a * (a + b) / b) := by'''
new = '''      o' = 0 ∨ (D = a + b ∧ o' = b * (a + b) / a) := by'''
