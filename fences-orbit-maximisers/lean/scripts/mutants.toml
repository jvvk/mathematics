# [Fences] Every mutant below states something false (counterexample in its name), except F1, which
# the caller asked for: T at n >= 150 is not refuted (58 <= n <= 180 is claimed by a separate
# computation); it is rejected only because the route through factorial_lt needs n >= 181.
# Equivalent mutant avoided: dropping "nonempty" in L5 (n - j <= 2^j). That statement is TRUE and is
# proved as exists_poset_orbitCount_ge' (an empty index gives an isolated bottom, still minimal).

[[mutant]]
name = """[Fences] F1 T: n >= 150 (not a falsity witness; proof route needs 181)"""
file = "../LeanProofs/Orbits516140/Fences.lean"
old = "theorem fence_union_not_max {α : Type*} [Fintype α] [PartialOrder α]\n    (hn : 181 ≤"
new = "theorem fence_union_not_max {α : Type*} [Fintype α] [PartialOrder α]\n    (hn : 150 ≤"

[[mutant]]
name = """[Fences] F2 L1: 2^(t+1) e <= n! (empty poset: 2 <= 1)"""
