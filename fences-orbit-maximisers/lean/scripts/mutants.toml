# Mutation suite for LeanProofs/Orbits516140 (MO 516140, answer 516154: orbits of linear extensions).
# Run: python3 -I ~/.claude/skills/mutation-harness/mutate.py scripts/orbits516140.toml
# Copy mode: each mutant is one statement or definition change, compiled as a copy of its own file
# against the built tree. Parts: [Basic] [Count] [Aut] [Posets] [Fences].
# Equivalent mutant avoided: weakening the order-reflecting condition in autCands to order-preserving
# (on a finite poset an order-preserving bijection is an automorphism, so the statement stays true).
[check]
cmd = ["lake", "env", "lean", "{file}"]
cwd = ".."
timeout = 900
mode = "copy"
fail_markers = ["error"]

[[mutant]]
name = '''[Basic] smul_eq_self_iff: phi^2 = 1 instead of phi = 1'''
file = "../LeanProofs/Orbits516140/Basic.lean"
old = '''φ • σ = σ ↔ φ = 1 := by'''
new = '''φ • σ = σ ↔ φ * φ = 1 := by'''

