      Fintype.card β = n ∧ (n - j)! ≤ orbitCount β :="""
new = """theorem exists_poset_orbitCount_ge (n j : ℕ) (h1 : 1 ≤ n - j) (h2 : n - j ≤ 2 ^ j - 1) :
    ∃ (β : Type) (_ : Fintype β) (_ : PartialOrder β),
      Fintype.card β = n ∧ (n - j + 1)! ≤ orbitCount β :="""

