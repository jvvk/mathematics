<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Georgia, 'Times New Roman', serif">
  <rect width="760" height="300" rx="10" fill="#fbfaf7"/>
  <!-- axes: x from 90 to 700, zero line at y=170; scale 3600 px per unit -->
  <line x1="80" y1="170" x2="710" y2="170" stroke="#3a3a3a" stroke-width="1.2"/>
  <line x1="80" y1="40" x2="80" y2="250" stroke="#3a3a3a" stroke-width="1.2"/>
  <text x="72" y="174" text-anchor="end" font-size="13" fill="#444">0</text>
  <line x1="76" y1="62" x2="80" y2="62" stroke="#3a3a3a"/><text x="72" y="66" text-anchor="end" font-size="13" fill="#444">0.03</text>
  <line x1="76" y1="242" x2="80" y2="242" stroke="#3a3a3a"/><text x="72" y="246" text-anchor="end" font-size="13" fill="#444">−0.02</text>
  <!-- divider at i = 3.5 -->
  <line x1="355" y1="40" x2="355" y2="250" stroke="#9a9a9a" stroke-dasharray="5 5"/>
  <text x="362" y="52" font-size="13" fill="#666">past i = m</text>
  <!-- bars alpha_i, x centre = 80 + 80 i -->
  <rect x="146" y="53.4" width="28" height="116.6" fill="#b9c6db" stroke="#2f5d9e"/>
  <rect x="226" y="170" width="28" height="3.5" fill="#e6c9a8" stroke="#9a6a1f"/>
  <rect x="306" y="170" width="28" height="68.8" fill="#e6c9a8" stroke="#9a6a1f"/>
  <rect x="386" y="170" width="28" height="38.1" fill="#e6c9a8" stroke="#9a6a1f"/>
  <rect x="466" y="170" width="28" height="5.7" fill="#e6c9a8" stroke="#9a6a1f"/>
  <rect x="546" y="170" width="28" height="1.2" fill="#e6c9a8" stroke="#9a6a1f"/>
  <rect x="626" y="170" width="28" height="0.6" fill="#e6c9a8" stroke="#9a6a1f"/>
  <!-- partial sums S_k -->
  <polyline points="160,53.4 240,56.8 320,125.6 400,163.7 480,169.5 560,170 640,170" fill="none" stroke="#1f1f1f" stroke-width="2"/>
  <g fill="#1f1f1f"><circle cx="160" cy="53.4" r="3.5"/><circle cx="240" cy="56.8" r="3.5"/><circle cx="320" cy="125.6" r="3.5"/><circle cx="400" cy="163.7" r="3.5"/><circle cx="480" cy="169.5" r="3.5"/><circle cx="560" cy="170" r="3.5"/><circle cx="640" cy="170" r="3.5"/></g>
  <g font-size="13" fill="#444" text-anchor="middle"><text x="160" y="190">1</text><text x="240" y="190">2</text><text x="320" y="262">3</text><text x="400" y="262">4</text><text x="480" y="190">5</text><text x="560" y="190">6</text><text x="640" y="190">7</text></g>
  <text x="700" y="160" text-anchor="end" font-size="14" fill="#444">i</text>
  <!-- legend -->
  <rect x="470" y="70" width="14" height="14" fill="#b9c6db" stroke="#2f5d9e"/><rect x="486" y="70" width="14" height="14" fill="#e6c9a8" stroke="#9a6a1f"/>
  <text x="508" y="82" font-size="14" fill="#1f1f1f">αᵢ = P(X ≤ m−i) − P(X ≥ m+i)</text>
  <line x1="470" y1="104" x2="500" y2="104" stroke="#1f1f1f" stroke-width="2"/><circle cx="485" cy="104" r="3.5" fill="#1f1f1f"/>
  <text x="508" y="109" font-size="14" fill="#1f1f1f">Sₖ = α₁ + … + αₖ ≥ 0, ending at 0</text>
  <text x="380" y="288" text-anchor="middle" font-size="14" fill="#444">X ~ Bin(10, 3/10), m = 3: the conjecture concerns k ≤ 3; continuing to k = n − m = 7 is the proof</text>
</svg>
